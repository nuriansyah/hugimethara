version: "2"
run:
  build-tags: [integration]
linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
  settings:
    depguard:
      rules:
        # Domain boundaries (docs/architecture/domain-boundaries.md):
        # platform/* is domain-free and must not import any domain package.
        platform-is-domain-free:
          files: ["**/internal/platform/**", "!$test"]
          deny:
            - pkg: github.com/nuriansyah/hugimethara/internal/transport/http
              desc: platform must not depend on the API layer
            - pkg: github.com/nuriansyah/hugimethara/internal/modules/workflow/event
              desc: platform must not depend on domains
        no-legacy-libs:
          files: ["$all"]
          deny:
            - pkg: github.com/lib/pq
              desc: use pgx/v5
            - pkg: github.com/pkg/errors
              desc: use the standard errors package
    gosec:
      excludes:
        - G104 # unchecked errors are covered by errcheck with explicit `_ =`
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]
      - path: internal/platform/testsupport/
        linters: [gosec]
formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/nuriansyah/hugimethara]

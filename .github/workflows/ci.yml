name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: hugi_owner
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hugi_owner" --health-interval 2s --health-retries 30
      redis:
        image: redis:8.8.4-alpine
        ports: ["6379:6379"]
    env:
      HUGI_TEST_POSTGRES_URL: postgres://hugi_owner:ci-only@127.0.0.1:5432/postgres?sslmode=disable
      HUGI_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify generated code is current
        run: |
          go generate ./...
          git diff --exit-code -- api/openapi
      - name: Vet
        run: go vet -tags integration ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: Unit tests
        run: go test -race ./...
      - name: Integration tests (Postgres + Redis services; NATS in-process)
        run: go test -race -tags integration -count=1 ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify generated API contract types are current
        run: pnpm generate:api && git diff --exit-code -- packages/shared-types/src/schema.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Dependency audit
        run: pnpm --filter hugimethara-web audit --prod --audit-level high

  images:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -t hugimethara/backend:ci .
      - name: Build web image
        run: docker build -f web/Dockerfile -t hugimethara/web:ci .
      - name: Scan images
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: hugimethara/backend:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

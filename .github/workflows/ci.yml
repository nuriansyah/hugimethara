name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify generated code is current
        run: |
          go generate ./...
          go tool sqlc generate
          git diff --exit-code -- internal/api/apigen internal/event/eventdb
      - name: Vet
        run: go vet -tags integration ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: backend
      - name: Unit tests
        run: go test -race ./...
      - name: Integration tests (testcontainers)
        run: go test -race -tags integration -count=1 ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify generated API client is current
        run: pnpm generate:api && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  images:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -t hugimethara/backend:ci backend
      - name: Build web image
        run: docker build -t hugimethara/web:ci web
      - name: Scan images
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: hugimethara/backend:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

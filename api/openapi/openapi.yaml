info:
    contact: {}
    description: Unified Business Operations & Intelligence Platform API.
    title: Hugimethara API
    version: 0.1.0
openapi: 3.0.3
paths:
    /healthz:
        get:
            operationId: getLiveness
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthReport'
                    description: Process is alive.
            summary: Liveness probe
            tags:
                - system
    /hooks/{public_id}:
        post:
            description: Unauthenticated; the request must carry a valid signature for the endpoint's verifier. Unknown or disabled endpoints answer 404. Invalid signatures and timestamps outside the tolerance answer 401 (signature_missing, signature_malformed, signature_invalid, timestamp_out_of_tolerance) and nothing is stored. A repeated provider event id answers 200 duplicate and starts nothing. Bodies are limited to 1 MiB; requests are rate-limited per endpoint.
            operationId: receiveWebhook
            parameters:
                - description: Endpoint public ID
                  in: path
                  name: public_id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                description: Provider payload
                required: true
                x-originalParamName: body
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WebhookReceipt'
                    description: Duplicate (or the Slack url_verification challenge)
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WebhookReceipt'
                    description: Accepted
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: Error (RFC 9457 problem details).
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: Error (RFC 9457 problem details).
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: Error (RFC 9457 problem details).
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: Error (RFC 9457 problem details).
            summary: Receive an inbound webhook
            tags:
                - webhooks
    /readyz:
        get:
            operationId: getReadiness
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthReport'
                    description: All dependencies ready.
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthReport'
                    description: At least one dependency is not ready.
            summary: Readiness probe (dependencies and migration version)
            tags:
                - system
    /v1/hugimethara/api-composition-executions:
        get:
            operationId: listApiCompositionExecutions
            parameters:
                - description: Workspace ID
                  in: query
                  name: workspace_id
                  required: true

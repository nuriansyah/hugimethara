openapi: 3.0.3
info:
  title: Hugimethara API
  version: 0.1.0
  description: |
    Unified Business Operations & Intelligence Platform API.
    Conventions (errors, pagination, idempotency, auth): docs/api/conventions.md.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /
security:
  - sessionCookie: []
  - apiKey: []
tags:
  - name: system
    description: Deployment metadata and health.
  - name: auth
    description: Sign-up, sign-in and the caller's sessions.
  - name: organization
    description: The caller's organization and its settings.
  - name: audit
    description: Organization audit trail.
  - name: workspace
    description: Workspaces, departments, environments and membership.
  - name: billing
    description: Plans, paid features and quotas.
  - name: access
    description: Roles, permissions, role assignments and access checks (RBAC).
  - name: identity
    description: Members, invitations, groups, service accounts and API keys.
paths:
  /healthz:
    get:
      tags: [system]
      operationId: getLiveness
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
  /readyz:
    get:
      tags: [system]
      operationId: getReadiness
      summary: Readiness probe (dependencies and migration version)
      security: []
      responses:
        "200":
          description: All dependencies ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        "503":
          description: At least one dependency is not ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
  /v1/hugimethara/system/info:
    get:
      tags: [system]
      operationId: getSystemInfo
      summary: Build and deployment information
      security: []
      responses:
        "200":
          description: Build and deployment information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
        default:
          $ref: "#/components/responses/Problem"
  /v1/hugimethara/organizations:
    post:
      tags: [auth]
      operationId: createOrganization
      summary: Sign up — create an organization and its first owner, and sign in
      description: |
        Public. Sets the session and CSRF cookies on success. Rate limited per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: Organization created; the caller is signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        Public. On success sets the session cookie (HttpOnly) and the CSRF cookie (readable by the page;
        echo it in `X-CSRF-Token` on state-changing requests). When the account belongs to several
        organizations and none is given, responds 409 `organization_required` with an `organizations` list.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "409":
          description: The user must choose an organization.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/OrganizationChoiceProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out (revoke the current session)
      security: []
      responses:
        "204": { description: Signed out; cookies cleared. }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/auth/oidc/providers:
    get:
      tags: [auth]
      operationId: listOidcProviders
      summary: Enabled SSO providers of an organization (public)
      description: |
        Public. Used by the sign-in page to offer a "Continue with SSO" button. Returns an empty
        list for unknown organizations so slugs cannot be enumerated. Rate limited per client IP.
      security: []
      parameters:
        - { name: organization, in: query, required: true, schema: { type: string, maxLength: 40 }, description: Organization slug. }
      responses:
        "200":
          description: Enabled identity providers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OidcProviderOption" }
        "429": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/auth/oidc/{idp_id}/start:
    get:
      tags: [auth]
      operationId: startOidcLogin
      summary: Begin an OIDC sign-in (public)
      description: |
        Public. Sets a sealed, short-lived state cookie (state, nonce, PKCE verifier) and redirects
        the browser to the identity provider. `redirect` is a relative web path to land on after
        sign-in (defaults to `/`). Failures redirect to the sign-in page with `sso_error`.
      security: []
      parameters:
        - { name: idp_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: redirect, in: query, schema: { type: string, maxLength: 512 } }
      responses:
        "302":
          description: Redirect to the identity provider (or to the sign-in page on failure).
          headers:
            Location: { schema: { type: string } }
        "429": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/auth/oidc/callback:
    get:
      tags: [auth]
      operationId: completeOidcLogin
      summary: Finish an OIDC sign-in (public)
      description: |
        Public. Validates state and nonce, exchanges the authorization code with PKCE, verifies the
        ID token signature, issuer and audience, links or just-in-time provisions the user, applies
        group mappings and sets the session cookies. Always redirects to the web app; failures carry
        a stable `sso_error` code.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: state, in: query, schema: { type: string, maxLength: 512 } }
        - { name: error, in: query, schema: { type: string, maxLength: 200 } }
        - { name: error_description, in: query, schema: { type: string, maxLength: 500 } }
      responses:
        "302":
          description: Redirect to the web app; session cookies are set on success.
          headers:
            Location: { schema: { type: string } }
        "429": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/identity/providers:
    get:
      tags: [identity]
      operationId: listIdentityProviders
      summary: OIDC identity providers
      description: "Permission: identity_provider:read. Secrets are never returned."
      responses:
        "200":
          description: Providers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/IdentityProvider" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [identity]
      operationId: createIdentityProvider
      summary: Configure an OIDC identity provider
      description: "Permission: identity_provider:create. The client secret is write-only."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityProviderCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/identity/providers/{provider_id}:
    parameters:
      - { name: provider_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [identity]
      operationId: getIdentityProvider
      summary: One identity provider
      description: "Permission: identity_provider:read."
      responses:
        "200":
          description: The provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [identity]
      operationId: updateIdentityProvider
      summary: Update an identity provider
      description: |
        Permission: identity_provider:update. Omitted client secret keeps the current one; an
        empty string removes it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityProviderUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [identity]
      operationId: deleteIdentityProvider
      summary: Delete an identity provider, its links and group mappings
      description: "Permission: identity_provider:delete. Members stay; they can no longer sign in through it."
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/identity/providers/{provider_id}/test:
    parameters:
      - { name: provider_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [identity]
      operationId: testIdentityProvider
      summary: Check discovery and signing-key reachability
      description: "Permission: identity_provider:test. Fetches the issuer's discovery document and JWKS."
      responses:
        "200":
          description: The probe result (ok=false carries a sanitized error).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProviderTest" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/identity/providers/{provider_id}/group-mappings:
    parameters:
      - { name: provider_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [identity]
      operationId: listGroupMappings
      summary: External-group to internal-group mappings
      description: "Permission: identity_provider:read."
      responses:
        "200":
          description: Mappings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/GroupMapping" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [identity]
      operationId: createGroupMapping
      summary: Map an IdP group to an internal group
      description: |
        Permission: identity_provider:update. Without `group_id` a group with `source: idp` is
        created from the external name (its members are then managed by the IdP only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupMappingCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMapping" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/identity/providers/{provider_id}/group-mappings/{mapping_id}:
    parameters:
      - { name: provider_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: mapping_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [identity]
      operationId: deleteGroupMapping
      summary: Remove a group mapping
      description: "Permission: identity_provider:update."
      responses:
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in user, their organization and session
      responses:
        "200":
          description: Current identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/me/sessions:
    get:
      tags: [auth]
      operationId: listMySessions
      summary: The caller's active sessions in this organization
      responses:
        "200":
          description: Active sessions, most recently used first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/me/sessions/{session_id}:
    delete:
      tags: [auth]
      operationId: revokeMySession
      summary: Revoke one of the caller's sessions
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/organizations/current:
    get:
      tags: [organization]
      operationId: getCurrentOrganization
      summary: The caller's organization
      description: "Permission: organization:read."
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [organization]
      operationId: updateCurrentOrganization
      summary: Update the caller's organization
      description: "Permission: organization:update. Audited as organization.updated."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrganizationRequest" }
      responses:
        "200":
          description: The updated organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: The organization audit trail, newest first
      description: "Permission: audit_event:read."
      parameters:
        - { name: action, in: query, schema: { type: string, maxLength: 100 }, description: "Exact action or prefix (e.g. `auth` matches `auth.*`)." }
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: resource_type, in: query, schema: { type: string, maxLength: 64 } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/departments:
    get:
      tags: [workspace]
      operationId: listDepartments
      summary: List departments
      description: "Permission: department:read."
      responses:
        "200":
          description: All departments.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Department" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [workspace]
      operationId: createDepartment
      summary: Create a department
      description: "Permission: department:create. May return 402 when the plan does not allow it."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepartmentCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Department" }
        "402": { $ref: "#/components/responses/PlanProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/departments/{department_id}:
    parameters:
      - { name: department_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [workspace]
      operationId: updateDepartment
      summary: Update a department
      description: "Permission: department:update."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepartmentUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Department" }
        "402": { $ref: "#/components/responses/PlanProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [workspace]
      operationId: deleteDepartment
      summary: Delete a department
      description: "Permission: department:delete."
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/environments:
    get:
      tags: [workspace]
      operationId: listEnvironments
      summary: List environments
      description: "Permission: environment:read."
      responses:
        "200":
          description: All environments.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [workspace]
      operationId: createEnvironment
      summary: Create a environment
      description: "Permission: environment:create. May return 402 when the plan does not allow it."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "402": { $ref: "#/components/responses/PlanProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/environments/{environment_id}:
    parameters:
      - { name: environment_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [workspace]
      operationId: updateEnvironment
      summary: Update a environment
      description: "Permission: environment:update."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "402": { $ref: "#/components/responses/PlanProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [workspace]
      operationId: deleteEnvironment
      summary: Delete a environment
      description: "Permission: environment:delete."
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/workspaces:
    get:
      tags: [workspace]
      operationId: listWorkspaces
      summary: Workspaces visible to the caller
      description: Owners see every workspace; members see the workspaces they belong to.
      parameters:
        - { name: include_archived, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Workspaces.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [workspace]
      operationId: createWorkspace
      summary: Create a workspace (the creator becomes its first member)
      description: "Permission: workspace:create. Counts against the plan's workspace quota (402 when reached)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "402": { $ref: "#/components/responses/PlanProblem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/workspaces/{workspace}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    get:
      tags: [workspace]
      operationId: getWorkspace
      summary: A workspace by its address
      description: "Permission: workspace:read (members of the workspace, or org-wide). Others get 404."
      responses:
        "200":
          description: The workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [workspace]
      operationId: updateWorkspace
      summary: Update a workspace

            properties:
                composition_id:
                    type: string
                duration_ms:
                    type: integer
                environment_id:
                    type: string
                error:
                    type: string
                id:
                    type: string
                output: {}
                request_id:
                    type: string
                started_at:
                    type: string
                status:
                    type: string
                step_summary:
                    additionalProperties: true
                    type: object
                version_id:
                    type: string
            required:
                - composition_id
                - duration_ms
                - environment_id
                - id
                - request_id
                - started_at
                - status
                - step_summary
                - version_id
            type: object
        ApiCompositionExecutions:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/ApiCompositionExecution'
                    type: array
            required:
                - data
            type: object
        ApiCompositionUpdate:
            properties:
                draft:
                    additionalProperties: true
                    type: object
                exposed:
                    type: boolean
                name:
                    type: string
                slug:
                    type: string
            type: object

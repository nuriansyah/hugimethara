components:
    schemas:
        AccessDecision:
            properties:
                allowed:
                    type: boolean
                matched_rules:
                    items:
                        type: string
                    type: array
                policy_version:
                    type: integer
                reason:
                    type: string
            required:
                - allowed
                - matched_rules
                - policy_version
                - reason
            type: object
        ApiComposition:
            properties:
                created_at:
                    type: string
                draft:
                    additionalProperties: true
                    type: object
                exposed:
                    type: boolean
                id:
                    type: string
                name:
                    type: string
                slug:
                    type: string
                updated_at:
                    type: string
                workspace_id:
                    type: string
            required:
                - created_at
                - draft
                - exposed
                - id
                - name
                - slug
                - updated_at
                - workspace_id
            type: object
        ApiCompositionCreate:
            properties:
                draft:
                    additionalProperties: true
                    type: object
                name:
                    type: string
                slug:
                    type: string
                workspace_id:
                    type: string
            required:
                - name
                - slug
                - workspace_id
            type: object
        ApiCompositionExecute:
            properties:
                environment_id:
                    type: string
                request:
                    additionalProperties: true
                    type: object
            required:
                - environment_id
            type: object

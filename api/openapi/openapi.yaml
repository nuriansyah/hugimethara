                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: Forbidden
            security:
                - sessionCookie: []
                - apiKey: []
            summary: List recent API composition executions

              schema: { $ref: "#/components/schemas/Role" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [access]
      operationId: updateRole
      summary: Replace a role's name, description and permissions
      description: "Permission: role:update. Added permissions must be ones you hold. Immutable roles keep their permissions."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [access]
      operationId: deleteRole
      summary: Delete an unused custom role
      description: "Permission: role:delete."
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/role-bindings:
    get:
      tags: [access]
      operationId: listRoleBindings
      summary: Role assignments
      description: "Permission: role:read."
      parameters:
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
        - { name: service_account_id, in: query, schema: { type: string, format: uuid } }
        - { name: principal_type, in: query, schema: { type: string, enum: [user, group, service_account] } }
        - { name: scope_type, in: query, schema: { type: string, enum: [org, workspace, resource] } }
        - { name: workspace_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Assignments.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RoleBinding" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [access]
      operationId: createRoleBinding
      summary: Assign a role to a member, group or service account at a scope
      description: "Permission: role:bind at the target scope; the role's permissions must all be held by you there."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleBindingCreate" }
      responses:
        "201":
          description: Assigned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleBinding" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/role-bindings/{binding_id}:
    parameters:
      - { name: binding_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [access]
      operationId: deleteRoleBinding
      summary: Remove a role assignment (the last owner cannot be removed)
      description: "Permission: role:bind at the assignment's scope."
      responses:
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/authorization/evaluate:
    post:
      tags: [access]
      operationId: evaluateAccess
      summary: Check whether a member could perform an action (simulation; not logged as a decision)
      description: "Permission: authorization:simulate."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluateRequest" }
      responses:
        "200":
          description: The decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessDecision" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/hugimethara/authorization/decisions:
    get:
      tags: [access]
      operationId: listAccessDecisions
      summary: Logged authorization decisions (every denial and sensitive allow), newest first
      description: "Permission: authorization:read_decisions."
      parameters:
        - { name: allowed, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/LoggedDecision" }
                  next_cursor: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hugi_session
      description: |
        Session cookie set by login/signup (`__Host-hugi_session` when served over HTTPS).
        State-changing requests must also send `X-CSRF-Token` with the value of the `hugi_csrf` cookie.
    apiKey:
      type: http
      scheme: bearer
      description: |
        Service-account API key: `Authorization: Bearer hugi_<prefix>_<secret>`. No CSRF token needed.
        Endpoints about the signed-in person (/me, sessions) are not available to API keys.
  parameters:
    WorkspaceSlug:
      name: workspace
      in: path
      required: true
      description: Workspace address (slug).
      schema: { type: string, maxLength: 40 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 512 }
  responses:
    PlanProblem:
      description: The organization's plan does not allow this (feature_not_in_plan or plan_limit_reached).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/PlanProblem" }
    Problem:
      description: Error (RFC 9457 problem details).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string, description: Stable machine-readable error code. }
        detail: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    PlanProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [feature, plan]
          properties:
            feature: { type: string }
            plan: { type: string }
            limit: { type: integer, format: int64 }
            current: { type: integer, format: int64 }
    Department:
      type: object
      required: [id, slug, name, description, workspace_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        workspace_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DepartmentCreate:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, maxLength: 40 }
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
    DepartmentUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
    Environment:
      type: object
      required: [id, slug, name, is_production, egress_allowlist, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        is_production: { type: boolean }
        egress_allowlist:
          type: array
          description: Internal CIDR ranges outbound calls may reach (paid feature).
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EnvironmentCreate:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, maxLength: 40 }
        name: { type: string, maxLength: 100 }
        is_production: { type: boolean }
        egress_allowlist: { type: array, maxItems: 100, items: { type: string, maxLength: 64 } }
    EnvironmentUpdate:
      type: object
      required: [name, is_production]
      properties:
        name: { type: string, maxLength: 100 }
        is_production: { type: boolean }
        egress_allowlist: { type: array, maxItems: 100, items: { type: string, maxLength: 64 } }
    Workspace:
      type: object
      required: [id, slug, name, description, member_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        department_id: { type: string, format: uuid }
        department_name: { type: string }
        archived_at: { type: string, format: date-time }
        member_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkspaceCreate:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, maxLength: 40 }
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        department_id: { type: string, format: uuid, nullable: true }
    WorkspaceUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        department_id: { type: string, format: uuid, nullable: true }
    Member:
      type: object
      required: [id, email, display_name, status, is_owner]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        status: { type: string }
        is_owner: { type: boolean }
        membership_status: { type: string, enum: [active, suspended], description: Organization lists only. }
        roles:
          type: array
          description: Role keys (organization-level in /users, workspace-level in workspace member lists).
          items: { type: string }
        groups:
          type: array
          description: Groups the member belongs to (/users/{id} only).
          items: { $ref: "#/components/schemas/GroupRef" }
        joined_at: { type: string, format: date-time }
        added_at: { type: string, format: date-time }
    FeatureDefinition:
      type: object
      required: [key, name, description, kind, unit]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [flag, limit] }
        unit: { type: string }
    EntitlementFeature:
      allOf:
        - $ref: "#/components/schemas/FeatureDefinition"
        - type: object
          required: [enabled, overridden]
          properties:
            enabled: { type: boolean }
            limit: { type: integer, format: int64, description: "Absent = unlimited (limit features)." }
            used: { type: integer, format: int64 }
            overridden: { type: boolean, description: "Granted specifically for this organization." }
    Entitlements:
      type: object
      required: [plan, status, features]
      properties:
        plan:
          type: object
          required: [key, name]
          properties:
            key: { type: string }
            name: { type: string }
        status: { type: string, enum: [active, trialing, past_due, canceled] }
        current_period_end: { type: string, format: date-time }
        features:
          type: array
          items: { $ref: "#/components/schemas/EntitlementFeature" }
    Plan:
      type: object
      required: [key, name, description, currency, entitlements]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        price_monthly_cents: { type: integer, format: int64, description: "Absent = custom pricing." }
        currency: { type: string }
        entitlements:
          type: object
          additionalProperties:
            type: object
            required: [enabled]
            properties:
              enabled: { type: boolean }
              limit: { type: integer, format: int64 }
    EffectivePermissions:
      type: object
      required: [organization, workspaces]
      properties:
        organization:
          type: array
          description: Permissions that apply everywhere in the organization.
          items: { type: string }
        workspaces:
          type: object
          description: Extra permissions per workspace id (from workspace roles).
          additionalProperties:
            type: array
            items: { type: string }
    ResourceType:
      type: object
      required: [type, description, actions, sensitive_actions]
      properties:
        type: { type: string }
        description: { type: string }
        actions: { type: array, items: { type: string } }
        sensitive_actions: { type: array, items: { type: string } }
    Role:
      type: object
      required: [id, key, name, description, is_system, immutable, permissions, binding_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        is_system: { type: boolean }
        immutable: { type: boolean }
        permissions: { type: array, items: { type: string } }
        binding_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RoleCreate:
      type: object
      required: [key, name, permissions]
      properties:
        key: { type: string, maxLength: 40 }
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        permissions: { type: array, maxItems: 200, items: { type: string, maxLength: 80 } }
    RoleUpdate:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        permissions: { type: array, maxItems: 200, items: { type: string, maxLength: 80 } }
    BindingScope:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [org, workspace, resource] }
        workspace_id: { type: string, format: uuid }
        resource_type: { type: string }
        resource_id: { type: string, maxLength: 200 }
    PrincipalType:
      type: string
      enum: [user, group, service_account]
    RoleBinding:
      type: object
      required: [id, principal, role, scope, created_at]
      properties:
        id: { type: string, format: uuid }
        principal:
          type: object
          required: [type, id, name]
          properties:
            type: { $ref: "#/components/schemas/PrincipalType" }
            id: { type: string, format: uuid }
            name: { type: string, description: "Display name, group name or service-account name." }
            email: { type: string, description: Users only. }
        user:
          type: object
          description: Present for user assignments (kept for older clients).
          required: [id, email, display_name]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            display_name: { type: string }
        role:
          type: object
          required: [id, key, name]
          properties:
            id: { type: string, format: uuid }
            key: { type: string }
            name: { type: string }
        scope: { $ref: "#/components/schemas/BindingScope" }
        workspace_slug: { type: string }
        workspace_name: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    RoleBindingCreate:
      type: object
      description: Exactly one of user_id, group_id, service_account_id.
      required: [role_id, scope]
      properties:
        user_id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        service_account_id: { type: string, format: uuid }
        role_id: { type: string, format: uuid }
        scope: { $ref: "#/components/schemas/BindingScope" }
        expires_at: { type: string, format: date-time }
    EvaluateRequest:
      type: object
      description: Exactly one of user_id (includes group roles) or service_account_id.
      required: [resource_type, action]
      properties:
        user_id: { type: string, format: uuid }
        service_account_id: { type: string, format: uuid }
        resource_type: { type: string }
        action: { type: string }
        resource_id: { type: string, maxLength: 200 }
        workspace_id: { type: string, format: uuid }
    AccessDecision:
      type: object
      required: [allowed, reason, matched_rules, policy_version]
      properties:
        allowed: { type: boolean }
        reason: { type: string }
        matched_rules: { type: array, items: { type: string } }
        policy_version: { type: integer, format: int64 }
    LoggedDecision:
      type: object
      required: [id, occurred_at, principal_id, action, resource_type, allowed, reason, matched_rules]
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        principal_id: { type: string, format: uuid }
        principal_type: { $ref: "#/components/schemas/PrincipalType" }
        principal_email: { type: string, description: "Email of a user, or the service-account name." }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        workspace_id: { type: string, format: uuid }
        allowed: { type: boolean }
        reason: { type: string }
        matched_rules: { type: array, items: { type: string } }
        request_id: { type: string }
    GroupRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    UserUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, suspended] }
    Group:
      type: object
      required: [id, name, description, source, member_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        source: { type: string, enum: [internal, idp] }
        member_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
    GroupMember:
      type: object
      required: [id, email, display_name, added_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        added_at: { type: string, format: date-time }
    InvitationWorkspace:
      type: object
      required: [workspace_id, workspace_name, role_id, role_name]
      properties:
        workspace_id: { type: string, format: uuid }
        workspace_name: { type: string }
        workspace_slug: { type: string }
        role_id: { type: string, format: uuid }
        role_name: { type: string }
    Invitation:
      type: object
      required: [id, email, status, workspaces, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        org_role:
          type: object
          required: [id, key, name]
          properties:
            id: { type: string, format: uuid }
            key: { type: string }
            name: { type: string }
        workspaces:
          type: array
          items: { $ref: "#/components/schemas/InvitationWorkspace" }
        invited_by_name: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time }
    InvitationCreate:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }
        org_role_id: { type: string, format: uuid, description: "Organization role in addition to Member." }
        workspaces:
          type: array
          maxItems: 50
          items:
            type: object
            required: [workspace_id, role_id]
            properties:
              workspace_id: { type: string, format: uuid }
              role_id: { type: string, format: uuid }
        expires_in_days: { type: integer, minimum: 1, maximum: 30, default: 7 }
    InvitationCreated:
      type: object
      required: [invitation, token, accept_path]
      properties:
        invitation: { $ref: "#/components/schemas/Invitation" }
        token: { type: string, description: Shown once. Anyone with the link can accept as the invited address. }
        accept_path: { type: string, description: "Web path of the invitation page, e.g. /invite/<token>." }
    InvitationPreview:
      type: object
      required: [organization, email, expires_at, account_exists]
      properties:
        organization: { $ref: "#/components/schemas/OrganizationSummary" }
        email: { type: string }
        invited_by_name: { type: string }
        expires_at: { type: string, format: date-time }
        account_exists: { type: boolean, description: "True: accept with the account's password. False: choose a name and password." }
    InvitationAccept:
      type: object
      properties:
        display_name: { type: string, maxLength: 100 }
        password: { type: string, maxLength: 1024 }
    ServiceAccount:
      type: object
      required: [id, name, description, disabled, active_key_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        disabled: { type: boolean }
        active_key_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ServiceAccountCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
    ServiceAccountUpdate:
      type: object
      required: [name, disabled]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        disabled: { type: boolean }
    ApiKey:
      type: object
      required: [id, name, prefix, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: "Identifies the key (hugi_<prefix>_…); not secret." }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
    ApiKeyCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        expires_at: { type: string, format: date-time }
    ApiKeyCreated:
      type: object
      required: [key, secret]
      properties:
        key: { $ref: "#/components/schemas/ApiKey" }
        secret: { type: string, description: "The full key. Shown once; store it in a secret manager." }
    ClaimMapping:
      type: object
      required: [email, name]
      properties:
        email: { type: string, maxLength: 200, description: "Claim carrying the verified email address." }
        name: { type: string, maxLength: 200, description: "Claim carrying the display name." }
        groups: { type: string, maxLength: 200, description: "Claim carrying group names. Empty disables group mapping." }
    IdentityProviderPreset:
      type: string
      enum: [entra, google, keycloak, generic]
    IdentityProvider:
      type: object
      required: [id, name, protocol, preset, issuer, client_id, has_client_secret, scopes, claim_mapping,
                 jit_provisioning, allowed_domains, enabled, redirect_uri, sso_url, group_mapping_count,
                 created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        protocol: { type: string, enum: [oidc] }
        preset: { $ref: "#/components/schemas/IdentityProviderPreset" }
        issuer: { type: string }
        client_id: { type: string }
        has_client_secret: { type: boolean, description: "The secret itself is never returned." }
        scopes: { type: array, items: { type: string } }
        claim_mapping: { $ref: "#/components/schemas/ClaimMapping" }
        jit_provisioning: { type: boolean, description: "Create members on first sign-in. Off: only existing members can link." }
        allowed_domains:
          type: array
          description: Email domains allowed to sign in. Empty allows every domain the IdP asserts.
          items: { type: string }
        enabled: { type: boolean }
        redirect_uri: { type: string, description: "Exact redirect URI to register at the identity provider." }
        sso_url: { type: string, description: "Browser URL that starts the SSO flow (points at the web origin)." }
        group_mapping_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IdentityProviderCreate:
      type: object
      required: [name, preset, issuer, client_id]
      properties:
        name: { type: string, maxLength: 100 }
        preset: { $ref: "#/components/schemas/IdentityProviderPreset" }
        issuer: { type: string, maxLength: 500, description: "Issuer URL; discovery is read from /.well-known/openid-configuration." }
        client_id: { type: string, maxLength: 255 }
        client_secret: { type: string, maxLength: 4096, format: password, description: "Write-only. Omit for public clients using PKCE." }
        scopes: { type: array, maxItems: 20, items: { type: string, maxLength: 64 } }
        claim_mapping: { $ref: "#/components/schemas/ClaimMapping" }
        jit_provisioning: { type: boolean, default: true }
        allowed_domains: { type: array, maxItems: 20, items: { type: string, maxLength: 255 } }
        enabled: { type: boolean, default: true }
    IdentityProviderUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, maxLength: 100 }
        preset: { $ref: "#/components/schemas/IdentityProviderPreset" }
        issuer: { type: string, maxLength: 500 }
        client_id: { type: string, maxLength: 255 }
        client_secret: { type: string, maxLength: 4096, format: password, description: "Omit to keep; empty string removes." }
        scopes: { type: array, maxItems: 20, items: { type: string, maxLength: 64 } }
        claim_mapping: { $ref: "#/components/schemas/ClaimMapping" }
        jit_provisioning: { type: boolean }
        allowed_domains: { type: array, maxItems: 20, items: { type: string, maxLength: 255 } }
        enabled: { type: boolean }
    IdentityProviderTest:
      type: object
      required: [ok, latency_ms, checked_at]
      properties:
        ok: { type: boolean }
        issuer: { type: string }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        jwks_uri: { type: string }
        latency_ms: { type: integer, format: int64 }
        error: { type: string, description: "Sanitized failure reason when ok is false." }
        checked_at: { type: string, format: date-time }
    GroupMapping:
      type: object
      required: [id, external_group, group_id, group_name, group_source, created_at]
      properties:
        id: { type: string, format: uuid }
        external_group: { type: string }
        group_id: { type: string, format: uuid }
        group_name: { type: string }
        group_source: { type: string, enum: [internal, idp] }
        created_at: { type: string, format: date-time }
    GroupMappingCreate:
      type: object
      required: [external_group]
      properties:
        external_group: { type: string, maxLength: 200 }
        group_id: { type: string, format: uuid, description: "Omit to create an IdP-managed group named after the external group." }
    OidcProviderOption:
      type: object
      required: [id, name, preset]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        preset: { $ref: "#/components/schemas/IdentityProviderPreset" }
    SignupRequest:
      type: object
      required: [organization_name, organization_slug, display_name, email, password]
      properties:
        organization_name: { type: string, minLength: 2, maxLength: 100, example: Acme Indonesia }
        organization_slug:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{1,38}[a-z0-9])$"
          example: acme-id
        display_name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, maxLength: 254, description: "Validated server-side; invalid addresses return a field error." }
        password: { type: string, minLength: 12, maxLength: 128, format: password }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 512, format: password }
        organization_slug: { type: string, maxLength: 40 }
    OrganizationChoice:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    OrganizationChoiceProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [organizations]
          properties:
            organizations:
              type: array
              items: { $ref: "#/components/schemas/OrganizationChoice" }
    User:
      type: object
      required: [id, email, display_name, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        status: { type: string, enum: [active, disabled] }
    OrganizationSummary:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
    SessionSummary:
      type: object
      required: [id, expires_at, idle_expires_at]
      properties:
        id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        idle_expires_at: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [user, organization, session]
      properties:
        user: { $ref: "#/components/schemas/User" }
        organization: { $ref: "#/components/schemas/OrganizationSummary" }
        session: { $ref: "#/components/schemas/SessionSummary" }
    Me:
      type: object
      required: [user, organization, membership, session]
      properties:
        user: { $ref: "#/components/schemas/User" }
        organization: { $ref: "#/components/schemas/OrganizationSummary" }
        membership:
          type: object
          required: [is_owner, joined_at]
          properties:
            is_owner: { type: boolean, description: "Interim until RBAC (S3): owners hold all permissions." }
            joined_at: { type: string, format: date-time }
        session: { $ref: "#/components/schemas/SessionSummary" }
    SessionInfo:
      type: object
      required: [id, current, created_at, last_seen_at, idle_expires_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        idle_expires_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        ip: { type: string }
        user_agent: { type: string }
    OrganizationSettings:
      type: object
      required: [session_idle_timeout_minutes, session_absolute_timeout_hours]
      properties:
        session_idle_timeout_minutes: { type: integer, minimum: 5, maximum: 1440 }
        session_absolute_timeout_hours: { type: integer, minimum: 1, maximum: 720 }
    Organization:
      type: object
      required: [id, slug, name, status, settings, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, suspended] }
        settings: { $ref: "#/components/schemas/OrganizationSettings" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UpdateOrganizationRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        settings: { $ref: "#/components/schemas/OrganizationSettings" }
    AuditEvent:
      type: object
      required: [id, occurred_at, actor_type, action, resource_type, outcome, details]
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        actor_type: { type: string, enum: [user, service_account, system, anonymous] }
        actor_id: { type: string, format: uuid }
        actor_email: { type: string }
        action: { type: string, example: organization.updated }
        resource_type: { type: string }
        resource_id: { type: string }
        workspace_id: { type: string, format: uuid }
        outcome: { type: string, enum: [success, failure, denied] }
        request_id: { type: string }
        ip: { type: string }
        details: { type: object, additionalProperties: true }
    AuditEventPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        next_cursor: { type: string }
    HealthReport:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, fail] }
        checks:
          type: object
          additionalProperties:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [ok, fail] }
              error: { type: string }
    SystemInfo:
      type: object
      required: [name, version, commit, go_version, environment, api_version]
      properties:
        name: { type: string, example: Hugimethara }
        version: { type: string, example: v0.1.0 }
        commit: { type: string }
        go_version: { type: string }
        environment: { type: string, enum: [development, staging, production, test] }
        api_version: { type: string, example: v1 }

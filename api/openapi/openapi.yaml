                    additionalProperties: true
                    type: object
                exposed:
                    type: boolean
                id:
                    type: string
                name:
                    type: string
                slug:
                    type: string
                updated_at:
                    type: string
                workspace_id:
                    type: string
            required:
                - created_at
                - draft
                - exposed
                - id
                - name
                - slug
                - updated_at
                - workspace_id
            type: object

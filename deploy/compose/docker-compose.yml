# Local development / evaluation stack. Not a production deployment.
#   docker compose -f deploy/compose/docker-compose.yml up --build
# Optional observability profile: --profile obs
# Object storage is added with the first slice that uses it (S7); see docs/IMPLEMENTATION_STATUS.md.
name: hugimethara

x-backend-env: &backend-env
  HUGI_ENV: development
  HUGI_LOG_FORMAT: json
  HUGI_NATS_URL: nats://nats:4222
  HUGI_REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: hugimethara
      POSTGRES_USER: hugi_owner
      POSTGRES_PASSWORD: ${HUGI_OWNER_PASSWORD:-hugi-owner-dev}
      HUGI_APP_PASSWORD: ${HUGI_APP_PASSWORD:-hugi-app-dev}
      HUGI_SYSTEM_PASSWORD: ${HUGI_SYSTEM_PASSWORD:-hugi-system-dev}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hugi_owner -d hugimethara"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  nats:
    image: nats:2.15.3-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: [natsdata:/data]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 3s
      retries: 20

  migrate:
    build: { context: ../../backend }
    image: hugimethara/backend:dev
    command: ["hugi-migrate", "up"]
    environment:
      <<: *backend-env
      HUGI_MIGRATE_DATABASE_URL: postgres://hugi_owner:${HUGI_OWNER_PASSWORD:-hugi-owner-dev}@postgres:5432/hugimethara?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: hugimethara/backend:dev
    command: ["hugi-api"]
    environment:
      <<: *backend-env
      HUGI_DATABASE_URL: postgres://hugi_app:${HUGI_APP_PASSWORD:-hugi-app-dev}@postgres:5432/hugimethara?sslmode=disable
      HUGI_CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports: ["127.0.0.1:${HUGI_API_PORT:-8080}:8080", "127.0.0.1:9090:9090"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      nats: { condition: service_healthy }

  worker:
    image: hugimethara/backend:dev
    command: ["hugi-worker"]
    environment:
      <<: *backend-env
      HUGI_SYSTEM_DATABASE_URL: postgres://hugi_system:${HUGI_SYSTEM_PASSWORD:-hugi-system-dev}@postgres:5432/hugimethara?sslmode=disable
    deploy:
      replicas: 2   # exercise concurrent relays from day one
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  web:
    build: { context: ../../web }
    image: hugimethara/web:dev
    environment:
      HUGI_API_URL: http://api:8080
    ports: ["127.0.0.1:${HUGI_WEB_PORT:-3000}:3000"]
    depends_on: [api]

  # --- optional observability (docker compose --profile obs up) ---
  otel-collector:
    profiles: [obs]
    image: otel/opentelemetry-collector-contrib:0.140.0
    ports: ["127.0.0.1:4317:4317"]

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.7.3
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9091:9090"]

volumes:
  pgdata:
  natsdata:

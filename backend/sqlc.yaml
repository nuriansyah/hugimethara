version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries/event
    gen:
      go:
        package: eventdb
        out: internal/event/eventdb
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: NullUUID
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: inet
            go_type: net/netip.Addr
          - db_type: inet
            nullable: true
            go_type:
              import: net/netip
              type: Addr
              pointer: true
